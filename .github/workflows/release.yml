name: Release

# Push an annotated tag such as v1.4.1 (its message becomes the in-app release notes):
#   git tag -a v1.4.1 -m "更新说明" && git push origin v1.4.1
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Signing secrets live only in this environment, which only accepts v* tags.
    environment: release
    permissions:
      contents: write
    env:
      # SHA-256 of the release signing certificate; a build signed by any other key is never published.
      EXPECTED_CERT_SHA256: 560f634ef552c57b670e65c7d9e2b398a918fb4422b7347adfafaaec269a2ea1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]{1,3})\.([0-9]{1,2})\.([0-9]{1,2})$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH (minor/patch < 100): $TAG"; exit 1; }
          name="${TAG#v}"
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          ./gradlew --no-daemon assembleRelease -PappVersionName="$VERSION_NAME"

      - name: Verify signature and version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | tee signer.txt
          grep -q "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signer.txt || { echo "APK is not signed with the release key"; exit 1; }
          badging=$("$tools/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          [[ "$badging" == *"name='com.jack.englishlearning' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"* ]] || { echo "Unexpected package/version"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes=$(git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
          file="learning-android-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$file"
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file" \
            --argjson size "$(stat -c %s "$file")" --arg sha "$(sha256sum "$file" | cut -d' ' -f1)" --arg notes "$notes" \
            '{schemaVersion: 1, versionCode: $code, versionName: $name, apkUrl: $url, size: $size, sha256: $sha, notes: $notes}' > latest.json
          cat latest.json
          sha256sum "$file" > "$file.sha256"
          gh release create "$TAG" "$file" "$file.sha256" latest.json --title "$VERSION_NAME" --notes "$notes" --verify-tag
